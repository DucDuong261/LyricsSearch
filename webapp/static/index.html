<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="view-transition" content="same-origin">
  <title>AI Music Matcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=4">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%231ed760'/%3E%3Ccircle cx='12' cy='12' r='3' fill='%23000'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#view">Bỏ qua tới nội dung</a>
  <div class="app">
    <aside class="sidebar" aria-label="Điều hướng chính">
      <a class="brand" href="#/hybrid" aria-label="AI Music Matcher - Trang chủ">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Music <b>Matcher</b></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <p class="sidebar-foot">Đồ án XLAT · Hệ thống tìm kiếm âm nhạc đa phương thức (Hybrid AI)</p>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <div class="status" id="status" role="status" aria-live="polite">
          <span class="status-dot"></span><span class="status-text">Đang kết nối...</span>
        </div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>

    <footer class="player" id="player" aria-label="Trình phát nhạc">
      <div class="player-track">
        <div class="cover cover-sm" id="player-cover" aria-hidden="true"></div>
        <div class="player-meta">
          <div class="player-title" id="player-title">Chưa phát bài nào</div>
          <div class="player-artist" id="player-artist">Nhấn nút phát ở kết quả để nghe bản gốc</div>
        </div>
      </div>
      <div class="player-center">
        <button class="btn-icon btn-play-main" id="player-toggle" aria-label="Phát" disabled></button>
        <div class="player-progress">
          <span class="time" id="player-cur">0:00</span>
          <input type="range" id="player-seek" min="0" max="100" value="0" step="0.1" aria-label="Tua bài hát" disabled>
          <span class="time" id="player-dur">0:00</span>
        </div>
      </div>
      <div class="player-right">
        <span class="vol-icon" aria-hidden="true" id="vol-icon"></span>
        <input type="range" id="player-vol" min="0" max="1" step="0.01" value="0.9" aria-label="Âm lượng">
      </div>
      <audio id="audio" preload="metadata"></audio>
    </footer>
  </div>
  <script src="/static/app.js?v=4"></script>
</body>
</html>
